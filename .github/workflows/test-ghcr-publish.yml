# AUTOGENERATED FROM test-ghcr-publish.jsonnet DO NOT MODIFY
jobs:
  test-ghcr-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Configure git safedir properly
        run: git config --global --add safe.directory $(pwd)
      - name: Make checkout speedy
        run: git config --global fetch.parallel 50
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        name: Set tags and labels
        uses: docker/metadata-action@v5
        with:
          flavor: latest=false
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - id: build
        name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: semgrep-cli
      - name: Output image details
        run: "echo \"### \U0001F389 Image published successfully!\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Digest:** ${{ steps.build.outputs.digest }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Pull command:**\" >> $GITHUB_STEP_SUMMARY\necho '```' >> $GITHUB_STEP_SUMMARY\necho \"docker pull ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\" >> $GITHUB_STEP_SUMMARY\necho '```' >> $GITHUB_STEP_SUMMARY\n"
name: Test GHCR Publishing
on:
  push:
    tags:
      - test-*
      - v*-test
  workflow_dispatch: {}
